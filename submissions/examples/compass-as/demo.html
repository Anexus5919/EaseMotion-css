<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compass</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scene">
    <div class="comp" tabindex="0">
      <span class="case"></span>
      <span class="ticks"></span>
      <span class="face"></span>
      <span class="mark mn">N</span>
      <span class="mark me">E</span>
      <span class="mark ms">S</span>
      <span class="mark mw">W</span>
      <div class="needle">
        <span class="pointn"></span>
        <span class="points"></span>
      </div>
      <span class="pin"></span>
      <span class="glassc"></span>
    </div>
    <span class="shadowc"></span>
  </div>
</body>
</html>
